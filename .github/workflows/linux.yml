name: Linux

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  packages:
    name: ${{ matrix.package }} (Linux)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # SwiftUI / SwiftData / Keychain / iCloud are Apple-only, so those examples
        # do not appear here. The packages below use only the cross-platform core.
        package: [cli, observability, vapor-example, wasm, tui, testing-showcase]
    steps:
      # Use the toolchain action so every package sees the same supported Swift release.
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: '6.0.3'
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
        working-directory: packages/${{ matrix.package }}
      - name: Test
        run: swift test
        working-directory: packages/${{ matrix.package }}
