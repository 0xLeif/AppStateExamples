name: WebAssembly

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  wasm-build:
    name: wasm-example (SwiftWasm)
    runs-on: ubuntu-latest
    # AppState 3.0 resolves the transitive WASM dependency blocker, so the pinned
    # SwiftWasm toolchain is now a required cross-platform gate.
    steps:
      - uses: actions/checkout@v4

      # Pin a Swift toolchain that has a matching SwiftWasm SDK release (the action
      # derives the SDK tag from the active Swift version; the runner's preinstalled
      # bleeding-edge Swift has no SwiftWasm release yet). See https://book.swiftwasm.org.
      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0.3'

      - name: Set up SwiftWasm
        uses: swiftwasm/setup-swiftwasm@v2

      - name: Build for wasm32-unknown-wasi
        run: swift build --swift-sdk wasm32-unknown-wasi
        working-directory: packages/wasm

  wasm-core-host:
    # The pure-logic WASMCore library and its tests run on a normal host toolchain,
    # so they are verified here too (the browser executable is excluded on host via
    # `#if canImport(JavaScriptKit)`).
    name: WASMCore (host)
    runs-on: ubuntu-latest
    steps:
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.1.0'
      - uses: actions/checkout@v4
      - name: Test WASMCore
        run: swift test
        working-directory: packages/wasm
