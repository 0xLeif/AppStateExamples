name: WebAssembly

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  wasm-build:
    name: wasm-example (SwiftWasm)
    runs-on: ubuntu-latest
    container: swift:6.3.3-noble
    # AppState 3.0 resolves the transitive WASM dependency blocker, so the pinned
    # SwiftWasm toolchain is now a required cross-platform gate.
    steps:
      - uses: actions/checkout@v4

      # SwiftWasm first ships Observation in its Swift 6.3 SDK. Pin the release compiler
      # and compatible SDK snapshot so AppState 3 cross-compiles reproducibly.
      - name: Install SwiftWasm SDK
        env:
          SWIFTWASM_ASSET: swift-wasm-6.3-SNAPSHOT-2026-06-11-a-wasm32-unknown-wasip1.artifactbundle.zip
          SWIFTWASM_RELEASE: https://github.com/swiftwasm/swift/releases/download/swift-wasm-6.3-SNAPSHOT-2026-06-11-a
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates curl
          curl --fail --location --retry 3 --output "/tmp/${SWIFTWASM_ASSET}" \
            "${SWIFTWASM_RELEASE}/${SWIFTWASM_ASSET}"
          curl --fail --location --retry 3 --output "/tmp/${SWIFTWASM_ASSET}.sha256" \
            "${SWIFTWASM_RELEASE}/${SWIFTWASM_ASSET}.sha256"
          cd /tmp
          sed "s|$|  ${SWIFTWASM_ASSET}|" "${SWIFTWASM_ASSET}.sha256" | sha256sum --check -
          swift sdk install "/tmp/${SWIFTWASM_ASSET}"

      - name: Build for wasm32-unknown-wasip1
        run: swift build --swift-sdk 6.3-SNAPSHOT-2026-06-11-a-wasm32-unknown-wasip1
        working-directory: packages/wasm

  wasm-core-host:
    # The pure-logic WASMCore library and its tests run on a normal host toolchain,
    # so they are verified here too (the browser executable is excluded on host via
    # `#if canImport(JavaScriptKit)`).
    name: WASMCore (host)
    runs-on: ubuntu-latest
    steps:
      - name: Import Swift signing keys
        run: curl --fail --silent --show-error --location --compressed https://www.swift.org/keys/all-keys.asc | gpg --import -
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: '6.0.3'
      - uses: actions/checkout@v4
      - name: Test WASMCore
        run: swift test
        working-directory: packages/wasm
