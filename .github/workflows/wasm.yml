name: WebAssembly

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  wasm-build:
    name: wasm-example (SwiftWasm)
    runs-on: ubuntu-latest
    # AppState 3.0 resolves the transitive WASM dependency blocker, so the pinned
    # SwiftWasm toolchain is now a required cross-platform gate.
    steps:
      - uses: actions/checkout@v4

      # SwiftWasm first ships Observation in its Swift 6.3 SDK. Pin the compiler and
      # SDK to the exact same official snapshot so AppState 3 cross-compiles reproducibly.
      - name: Import Swift signing keys
        run: curl --fail --silent --show-error --location --compressed https://www.swift.org/keys/all-keys.asc | gpg --import -
      - name: Set up Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: '6.3-snapshot-2026-06-11'

      - name: Set up SwiftWasm
        id: swiftwasm
        uses: swiftwasm/setup-swiftwasm@v2
        with:
          tag: swift-6.3-DEVELOPMENT-SNAPSHOT-2026-06-11-a
          target: wasm32-unknown-wasip1

      - name: Build for wasm32-unknown-wasip1
        run: swift build --swift-sdk "${{ steps.swiftwasm.outputs.swift-sdk-id }}"
        working-directory: packages/wasm

  wasm-core-host:
    # The pure-logic WASMCore library and its tests run on a normal host toolchain,
    # so they are verified here too (the browser executable is excluded on host via
    # `#if canImport(JavaScriptKit)`).
    name: WASMCore (host)
    runs-on: ubuntu-latest
    steps:
      - name: Import Swift signing keys
        run: curl --fail --silent --show-error --location --compressed https://www.swift.org/keys/all-keys.asc | gpg --import -
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: '6.0.3'
      - uses: actions/checkout@v4
      - name: Test WASMCore
        run: swift test
        working-directory: packages/wasm
