name: WidgetDemo

packages:
  AppState:
    url: https://github.com/0xLeif/AppState.git
    exactVersion: 3.0.1
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing.git
    exactVersion: 1.19.3

options:
  bundleIdPrefix: com.0xleif
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    OTHER_SWIFT_FLAGS: -enable-experimental-feature StrictConcurrency
    ENABLE_TESTABILITY: YES

targets:
  WidgetDemoCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources/Shared
      - path: Sources/Widget/FocusEntry.swift
      - path: Sources/Widget/FocusTimelineSource.swift
      - path: Sources/Widget/FocusWidgetView.swift
    dependencies:
      - package: AppState
        product: AppState
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.0xleif.AppStateWidgetDemo.Core
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: YES

  WidgetDemo:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
    dependencies:
      - target: WidgetDemoCore
      - target: WidgetDemoWidget
        embed: true
      - package: AppState
        product: AppState
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.0xleif.AppStateWidgetDemo
        INFOPLIST_FILE: Sources/App/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGN_ENTITLEMENTS: SupportingFiles/WidgetDemo.entitlements

  WidgetDemoWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widget
        excludes:
          - FocusEntry.swift
          - FocusTimelineSource.swift
          - FocusWidgetView.swift
    dependencies:
      - target: WidgetDemoCore
      - package: AppState
        product: AppState
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.0xleif.AppStateWidgetDemo.Widget
        INFOPLIST_FILE: Sources/Widget/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGN_ENTITLEMENTS: SupportingFiles/WidgetDemoWidget.entitlements

  WidgetDemoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: WidgetDemo
      - target: WidgetDemoCore
      - package: AppState
        product: AppState
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.0xleif.AppStateWidgetDemo.tests
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: YES

  WidgetDemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: WidgetDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.0xleif.AppStateWidgetDemo.uitests
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  WidgetDemo:
    build:
      targets:
        WidgetDemo: all
        WidgetDemoWidget: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WidgetDemoTests
        - WidgetDemoUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
