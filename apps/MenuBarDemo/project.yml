name: MenuBarDemo

packages:
  AppState:
    url: https://github.com/0xLeif/AppState.git
    exactVersion: 3.0.0
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing.git
    exactVersion: 1.19.3

options:
  bundleIdPrefix: com.0xleif
  deploymentTarget:
    macOS: "14.0"
  defaultConfig: Debug
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    OTHER_SWIFT_FLAGS: -enable-experimental-feature StrictConcurrency
    ENABLE_TESTABILITY: YES

targets:
  MenuBarDemo:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - package: AppState
        product: AppState
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.0xleif.AppStateMenuBarDemo
        INFOPLIST_FILE: Sources/App/Info.plist
        MACOSX_DEPLOYMENT_TARGET: "14.0"

  MenuBarDemoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: MenuBarDemo
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.0xleif.AppStateMenuBarDemo.tests
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MenuBarDemo:
    build:
      targets:
        MenuBarDemo: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MenuBarDemoTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
